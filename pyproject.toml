[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "skyshift"
version = "0.12.0"
description = "Traceable qualitative comparison of SPHEREx observations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "astropy>=7,<9", "scipy>=1.14,<2",
  "reproject>=0.14,<1", "streamlit>=1.40,<2", "pydantic>=2.10,<3",
  "matplotlib>=3.9,<4", "photutils>=2,<4", "pyvo>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
"AI assistance" = "https://github.com/MuathYasin000/SKYSHIFT_Project_Mercury/blob/codex/observations-fix/AI_DISCLOSURE.md"

[tool.skyshift.ai-assistance]
disclosure = "AI_DISCLOSURE.md"
usage = "OpenAI Codex assisted implementation, archive integration, tests and documentation. Anthropic Claude assisted review and instructions for the coding agent. Upstream observations are real archive measurements."

[project.scripts]
skyshift = "skyshift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

